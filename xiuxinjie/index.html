    <style>
      :root {
        color-scheme: dark;
        --bg: #17121f;
        --surface: #221a30;
        --surface-2: #2a2140;
        --text: #e9e4f2;
        --dim: #a79ec0;
        --faint: #7e7398;
        --border: #372d4d;
        --accent: #8b7ab8;
        --accent-soft: #b3a6d4;
        --accent-deep: #4a3a6e;
        --amber: #d9a75a;
        --radius: 12px;
        --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      .serif { font-family: var(--serif); }
      .wrap { max-width: 672px; margin: 0 auto; width: 100%; }
      main { padding-bottom: 104px; }
      .px { padding-left: 20px; padding-right: 20px; }
      h2.sec-title { font-family: var(--serif); font-size: 18px; font-weight: 600; margin: 0; }
      .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      button { font: inherit; cursor: pointer; background: none; border: none; color: inherit; }
      a { color: var(--accent-soft); }
      .chip {
        border-radius: 999px; border: 1px solid var(--border);
        padding: 8px 16px; font-size: 14px; color: var(--dim);
        background: transparent; transition: background .15s, color .15s;
        min-height: 40px;
      }
      .chip.on { border-color: var(--accent); background: var(--accent-deep); color: var(--text); }
      .chip.small { padding: 6px 14px; min-height: 36px; }
      .btn-primary {
        border-radius: 999px; background: var(--accent-deep); color: var(--text);
        padding: 10px 22px; font-size: 14px; font-weight: 500; min-height: 44px;
      }
      .btn-primary:disabled { opacity: .5; }
      .btn-ghost {
        border-radius: 999px; border: 1px solid var(--accent); color: var(--accent-soft);
        padding: 4px 14px; font-size: 14px; min-height: 36px;
      }
      .btn-ghost:disabled { border-color: var(--border); color: var(--faint); }
      .card { background: var(--surface); border-radius: var(--radius); padding: 16px; }
      input, textarea {
        font: inherit; font-size: 14px; color: var(--text);
        background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 8px 12px; width: 100%;
      }
      textarea { resize: vertical; }
      input::placeholder, textarea::placeholder { color: var(--faint); }
      label.flabel { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .err { color: var(--amber); font-size: 14px; margin-top: 8px; }

      /* hero */
      .hero { position: relative; overflow: hidden; }
      .hero img { display: block; width: 100%; height: 236px; object-fit: cover; object-position: center; }
      @media (min-width: 640px) { .hero img { height: 320px; } }
      .hero-shade {
        position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(23,18,31,.62) 0%, rgba(23,18,31,.38) 42%, rgba(23,18,31,.72) 78%, var(--bg) 99%);
      }
      .hero-body {
        position: absolute; inset-inline: 0; bottom: 0; padding: 0 20px 8px;
        text-shadow: 0 1px 14px rgba(23,18,31,.95), 0 0 3px rgba(23,18,31,.9);
      }
      .hero-date { font-size: 12px; letter-spacing: .3em; color: var(--accent-soft); margin: 0; }
      .hero-kicker { font-size: 12px; letter-spacing: .3em; color: var(--dim); margin: 4px 0 0; }
      .hero-quote { font-family: var(--serif); font-size: 26px; font-weight: 600; line-height: 1.35; margin: 8px 0 0; }
      @media (min-width: 640px) { .hero-quote { font-size: 30px; } }
      .hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px; font-size: 14px; }
      .hero-meta .src { color: var(--dim); }
      .hero-meta a { text-decoration: underline; text-decoration-color: var(--accent-deep); text-underline-offset: 4px; }

      .today-strip {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
        padding: 16px 0; margin-top: 24px;
      }

      /* lecture cards */
      .lecture { border-bottom: 1px solid var(--border); padding: 16px 0; }
      .lecture:last-child { border-bottom: none; }
      .lecture-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .lecture-title { font-family: var(--serif); font-size: 16px; font-weight: 600; line-height: 1.45; margin: 0; }
      .platform {
        flex-shrink: 0; border-radius: 999px; padding: 2px 8px; font-size: 12px;
        background: var(--surface-2); color: var(--dim);
      }
      .platform.done { background: var(--accent-deep); color: var(--accent-soft); }
      .lecture-format { font-size: 12px; color: var(--faint); margin: 4px 0 0; }
      .lecture-note { font-size: 14px; line-height: 1.7; color: var(--dim); margin: 8px 0 0; }
      .lecture-actions { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
      .listen-btn {
        border-radius: 999px; background: var(--accent-deep); color: var(--text);
        padding: 6px 16px; font-size: 14px; text-decoration: none; display: inline-block;
      }
      .done-toggle { font-size: 14px; color: var(--dim); padding: 6px 0; }
      .done-toggle.on { color: var(--amber); }

      /* stats */
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; margin-top: 24px; }
      .stat { background: var(--surface); border-radius: var(--radius); padding: 12px 4px; }
      .stat .num { font-family: var(--serif); font-size: 24px; font-weight: 600; margin: 0; }
      .stat .num.amber { color: var(--amber); }
      .stat .lbl { font-size: 12px; color: var(--dim); margin: 2px 0 0; }

      /* calendar */
      .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; color: var(--faint); }
      .cal-week span { padding: 4px 0; }
      .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .cal-day {
        aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        border-radius: 8px; font-size: 14px; color: var(--dim);
      }
      .cal-day.practiced { background: var(--accent-deep); color: var(--text); }
      .cal-day.today { border: 1px solid var(--amber); color: var(--text); }
      .cal-day .dot { width: 4px; height: 4px; border-radius: 999px; background: var(--amber); margin-top: 2px; }
      .cal-nav-btn { border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--dim); min-height: 32px; }
      .cal-nav-btn:disabled { opacity: .4; }

      /* log & quote lists */
      .log-item, .quote-item { border-bottom: 1px solid var(--border); padding: 14px 0; }
      .log-item:last-child, .quote-item:last-child { border-bottom: none; }
      .log-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      .log-main { font-size: 14px; font-weight: 500; margin: 0; }
      .log-kinds { color: var(--accent-soft); margin-left: 8px; }
      .log-mins { color: var(--dim); margin-left: 8px; font-weight: 400; }
      .log-actions { display: flex; gap: 12px; flex-shrink: 0; font-size: 14px; }
      .log-actions button { color: var(--dim); padding: 4px 0; }
      .log-actions .del { color: var(--faint); }
      .log-note { font-size: 14px; line-height: 1.7; color: var(--dim); white-space: pre-wrap; margin: 6px 0 0; }
      .quote-text { font-family: var(--serif); font-size: 18px; font-weight: 600; line-height: 1.6; margin: 0; }
      .quote-text.small { font-size: 16px; }
      .quote-src { font-size: 14px; color: var(--dim); margin: 4px 0 0; }
      .reflection {
        font-size: 14px; line-height: 1.7; color: var(--dim); white-space: pre-wrap;
        border-left: 2px solid var(--accent-deep); padding-left: 12px; margin: 8px 0 0;
      }
      .quote-actions { display: flex; gap: 16px; margin-top: 8px; font-size: 14px; }
      .quote-actions .edit { color: var(--accent-soft); }
      .quote-actions .del { color: var(--faint); }
      .edit-actions { display: flex; gap: 8px; margin-top: 8px; }
      .edit-actions .save { border-radius: 999px; background: var(--accent-deep); padding: 6px 16px; font-size: 14px; color: var(--text); }
      .edit-actions .cancel { border-radius: 999px; border: 1px solid var(--border); padding: 6px 16px; font-size: 14px; color: var(--dim); }

      .empty { padding: 16px 0; font-size: 14px; line-height: 1.8; color: var(--dim); }
      .empty.center { text-align: center; padding: 24px 0; }
      .foot-note { text-align: center; font-size: 12px; line-height: 1.7; color: var(--faint); padding: 8px 20px 0; }
      .dim { color: var(--dim); font-size: 14px; line-height: 1.7; }
      .amber-text { color: var(--amber); }

      /* bottom nav */
      nav.bottom {
        position: fixed; inset-inline: 0; bottom: 0; z-index: 20;
        border-top: 1px solid var(--border); background: var(--bg);
        padding-bottom: env(safe-area-inset-bottom);
      }
      nav.bottom .wrap { display: grid; grid-template-columns: repeat(5, 1fr); }
      .nav-btn {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: 10px 0; font-size: 12px; color: var(--faint); min-height: 56px;
      }
      .nav-btn .glyph { font-family: var(--serif); font-size: 18px; line-height: 1; }
      .nav-btn.active { color: var(--accent-soft); }
      .nav-btn.active .lbl { font-weight: 500; }

      /* 正念模块 */
      .breath-stage { display:flex; flex-direction:column; align-items:center; padding: 20px 0 8px; }
      .breath-circle {
        width: 168px; height: 168px; border-radius: 999px;
        background: radial-gradient(circle at 50% 42%, #5a4a86 0%, #4a3a6e 58%, #3a2d58 100%);
        border: 1px solid var(--accent);
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
        transition: transform 1s linear;
        will-change: transform;
      }
      .breath-phase { font-family: var(--serif); font-size: 22px; font-weight:600; }
      .breath-count { font-size: 13px; color: var(--accent-soft); min-height: 18px; }
      .breath-progress { font-size: 13px; color: var(--dim); margin-top: 14px; min-height: 20px; text-align:center; }
      .talk-daily { background: var(--surface-2); border-radius: var(--radius); padding: 20px 16px; text-align:center; }
      .talk-daily .talk-text { font-family: var(--serif); font-size: 20px; font-weight:600; line-height:1.6; margin: 8px 0 0; }
      .guide-card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-top: 12px; }
      .guide-step { font-size: 15px; line-height: 1.8; background: var(--bg); border-radius: var(--radius); padding: 14px; margin-top: 12px; min-height: 76px; }
      .talk-item { border-bottom: 1px solid var(--border); padding: 12px 0; }
      .talk-item:last-child { border-bottom: none; }
      .talk-item .t-text { font-family: var(--serif); font-size: 16px; line-height: 1.6; margin: 0; }
      .reframe-pair { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; margin-top: 12px; }
      .reframe-pair .harsh { font-size: 14px; color: var(--faint); line-height:1.7; margin:0; }
      .reframe-pair .kind { font-family: var(--serif); font-size: 16px; line-height:1.7; margin: 6px 0 0; color: var(--text); }
      .sec-sub { font-size: 14px; font-weight: 500; color: var(--accent-soft); margin: 0 0 4px; }

      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>

      /* ============ 日期工具（访问者本地日历日） ============ */

      function toDateStr(d) {
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + day;
      }
      function parseDateStr(s) {
        var p = s.split("-").map(Number);
        return new Date(p[0] || 1970, (p[1] || 1) - 1, p[2] || 1);
      }
      function addDays(d, n) {
        var c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        c.setDate(c.getDate() + n);
        return c;
      }
      function friendlyDate(s, todayStr) {
        if (s === todayStr) return "今天";
        if (s === toDateStr(addDays(new Date(), -1))) return "昨天";
        var d = parseDateStr(s);
        return (d.getMonth() + 1) + "月" + d.getDate() + "日 · 周" + WEEKDAYS[d.getDay()];
      }
      function computeStreak(dates, todayStr) {
        var cursor = parseDateStr(todayStr);
        if (!dates.has(todayStr)) {
          cursor = addDays(cursor, -1);
          if (!dates.has(toDateStr(cursor))) return 0;
        }
        var streak = 0;
        while (dates.has(toDateStr(cursor))) {
          streak += 1;
          cursor = addDays(cursor, -1);
        }
        return streak;
      }
      function dayIndex(date) {

      /* ============ 渲染：听经台 ============ */

      function renderLectures() {
        var visible = lectureTopic === "全部" ? LECTURES : LECTURES.filter(function (l) { return l.topic === lectureTopic; });
        var html = '<div class="px" style="padding-top:24px;">';
        html += '<div class="sec-head"><h2 class="sec-title">听经台</h2><span class="dim">已听完 ' + state.doneLectureIds.length + " / " + LECTURES.length + "</span></div>";
        html += '<p class="dim" style="margin:-4px 0 16px;">体佛法师的讲经与开示，按经与主题整理。点开即去原站收听——法师常提醒：听经要听完整，不要断章取义。</p>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;" role="group" aria-label="按主题筛选课程">';
        ["全部"].concat(LECTURE_TOPICS).forEach(function (t) {
          html += '<button type="button" class="chip small' + (lectureTopic === t ? " on" : "") + '" data-action="topic" data-topic="' + t + '" aria-pressed="' + (lectureTopic === t) + '">' + t + "</button>";
        });
        html += "</div><div>";
        visible.forEach(function (l) { html += lectureCardHTML(l); });
        html += "</div>";
        html += '<p style="text-align:center;font-size:14px;color:var(--dim);padding:24px 0;">更多讲经视频与讲义：<a href="' + MORE_RESOURCES_URL + '" target="_blank" rel="noreferrer" style="text-decoration:underline;text-decoration-color:var(--accent-deep);text-underline-offset:4px;">吉验文化 · 体佛法师专页</a></p>';
        html += "</div>";
        return html;
      }

      /* ============ 渲染：修行记录 ============ */

      function renderPractice(todayStr) {
        var practicedDates = new Set(state.logs.map(function (l) { return l.date; }));

      /* ============ 呼吸计时 ============ */

      function breathTick() {
        var rhythm = BREATH_RHYTHMS[breathRhythm];
        var phase = rhythm.phases[breathPhaseIdx];
        breathPhaseElapsed += 0.1;
        breathTotalElapsed += 0.1;
        var totalSec = breathMinutes * 60;
        if (breathTotalElapsed >= totalSec) {
          breathStop();
          breathFinished = true; breathRunning = false;
          breathPhaseElapsed = 0; breathTotalElapsed = totalSec;
          render();
          return;
        }
        if (breathPhaseElapsed >= phase.sec) {
          breathPhaseElapsed = 0;
          breathPhaseIdx = (breathPhaseIdx + 1) % rhythm.phases.length;
          phase = rhythm.phases[breathPhaseIdx];
        }
        var circle = document.getElementById("breath-circle");
        var phaseEl = document.getElementById("breath-phase");
        var countEl = document.getElementById("breath-count");
        var progEl = document.getElementById("breath-progress");
        if (!circle) { breathStop(); return; }
        var p = Math.min(1, breathPhaseElapsed / phase.sec);
        var scale = phase.from + (phase.to - phase.from) * p;
        circle.style.transitionDuration = "0.12s";
        circle.style.transform = "scale(" + scale.toFixed(3) + ")";
        if (phaseEl) phaseEl.textContent = phase.name;
        if (countEl) countEl.textContent = Math.ceil(phase.sec - breathPhaseElapsed) + " 秒";
        if (progEl) progEl.textContent = "已练习 " + fmtClock(breathTotalElapsed) + " / " + fmtClock(totalSec);
      }
      function breathStartTimer() {
        breathStop();
        breathTimer = setInterval(breathTick, 100);
        var circle = document.getElementById("breath-circle");
        var rhythm = BREATH_RHYTHMS[breathRhythm];
        var phase = rhythm.phases[breathPhaseIdx];
        if (circle) {
          var p = Math.min(1, breathPhaseElapsed / phase.sec);
          circle.style.transform = "scale(" + (phase.from + (phase.to - phase.from) * p).toFixed(3) + ")";
        }
      }
      function breathStop() {
        if (breathTimer) { clearInterval(breathTimer); breathTimer = null; }
      }
      function breathReset() {
        breathStop();
        breathRunning = false; breathFinished = false; breathLogged = false;
        breathPhaseIdx = 0; breathPhaseElapsed = 0; breathTotalElapsed = 0;
      }

      /* ============ 主渲染 ============ */

      var view = document.getElementById("view");
      var tabbar = document.getElementById("tabbar");

      function render() {
        var todayStr = toDateStr(new Date());
        tabbar.innerHTML = TABS.map(function (t) {
          return '<button type="button" class="nav-btn' + (tab === t.id ? " active" : "") + '" data-action="goto" data-tab="' + t.id + '" aria-pressed="' + (tab === t.id) + '" aria-label="切换到' + t.label + '"><span class="glyph" aria-hidden="true">' + t.glyph + '</span><span class="lbl">' + t.label + "</span></button>";
        }).join("");

        if (tab === "today") view.innerHTML = renderToday(todayStr);
        else if (tab === "lectures") view.innerHTML = renderLectures();
        else if (tab === "practice") view.innerHTML = renderPractice(todayStr);
        else if (tab === "mindful") view.innerHTML = renderMindful(todayStr);
        else view.innerHTML = renderFayu();
        if (tab === "mindful" && breathRunning) breathStartTimer();
      }

      function saveFayuById(id) {
        var f = null;
        for (var i = 0; i < FAYU_JINGXUAN.length; i++) if (FAYU_JINGXUAN[i].id === id) f = FAYU_JINGXUAN[i];
        if (!f) return;
        if (state.quotes.some(function (q) { return q.text === f.text; })) return;
        state.quotes.unshift({ id: uid(), text: f.text, source: f.source, reflection: "" });
        saveState();
      }

      /* ============ 事件处理 ============ */

      document.addEventListener("click", function (ev) {
        var el = ev.target.closest ? ev.target.closest("[data-action]") : null;
        if (!el) return;
        var action = el.getAttribute("data-action");
        var todayStr = toDateStr(new Date());

        if (action === "goto") {
          if (breathRunning) { breathRunning = false; breathStop(); }
          tab = el.getAttribute("data-tab");
          editingLogId = null; editingQuoteId = null;
          render();
          window.scrollTo(0, 0);
          var t = TABS.filter(function (x) { return x.id === tab; })[0];
          if (t) countView(t.path);
        } else if (action === "topic") {
          lectureTopic = el.getAttribute("data-topic");
          render();
        } else if (action === "toggle-done") {
          var lid = el.getAttribute("data-id");
          var idx = state.doneLectureIds.indexOf(lid);
          if (idx === -1) state.doneLectureIds.push(lid); else state.doneLectureIds.splice(idx, 1);
          saveState(); render();
        } else if (action === "save-fayu") {
          saveFayuById(el.getAttribute("data-id"));
          render();
        } else if (action === "kind") {
          var mel = document.getElementById("minutes");
          var nel = document.getElementById("new-note");
          if (mel) formMinutes = mel.value;
          if (nel) formNote = nel.value;
          var k = el.getAttribute("data-kind");
          var ki = formKinds.indexOf(k);
          if (ki === -1) formKinds.push(k); else formKinds.splice(ki, 1);
          render();
        } else if (action === "add-log") {
          var minutesEl = document.getElementById("minutes");
          var noteEl = document.getElementById("new-note");
          var minutesRaw = minutesEl ? minutesEl.value.trim() : "";
          var noteVal = noteEl ? noteEl.value.trim() : "";
          formMinutes = minutesRaw; formNote = noteVal;
          if (formKinds.length === 0) { formError = "先选一种修行方式。"; render(); return; }
          var minutes = null;
          if (minutesRaw !== "") {
            var n = Number(minutesRaw);
            if (!isFinite(n) || n < 1 || n > 1440) { formError = "时长填 1–1440 之间的分钟数，或者留空。"; render(); return; }
            minutes = n;
          }
          formError = "";
          formMinutes = ""; formNote = "";
          state.logs.unshift({ id: uid(), date: todayStr, kinds: formKinds.slice(), minutes: minutes, note: noteVal });
          state.logs.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
          saveState(); render();
          window.scrollTo(0, 0);
        } else if (action === "edit-log") {
          var eid = el.getAttribute("data-id");
          editingLogId = editingLogId === eid ? null : eid;
          render();
        } else if (action === "cancel-edit-log") {
          editingLogId = null; render();
        } else if (action === "save-log-note") {
          var sid = el.getAttribute("data-id");
          var ta = document.getElementById("log-note-" + sid);
          var val = ta ? ta.value.trim() : "";
          state.logs.forEach(function (l) { if (l.id === sid) l.note = val; });
          editingLogId = null; saveState(); render();
        } else if (action === "delete-log") {
          var did = el.getAttribute("data-id");
          state.logs = state.logs.filter(function (l) { return l.id !== did; });
          if (editingLogId === did) editingLogId = null;
          saveState(); render();
        } else if (action === "month") {
          var dir = Number(el.getAttribute("data-dir"));
          if (dir === 0) monthOffset = 0; else monthOffset += dir;
          if (monthOffset > 0) monthOffset = 0;
          render();
        } else if (action === "edit-quote") {
          editingQuoteId = el.getAttribute("data-id"); render();
        } else if (action === "cancel-edit-quote") {
          editingQuoteId = null; render();
        } else if (action === "save-reflection") {
          var qid = el.getAttribute("data-id");
          var rta = document.getElementById("refl-" + qid);
          var rval = rta ? rta.value.trim() : "";
          state.quotes.forEach(function (q) { if (q.id === qid) q.reflection = rval; });
          editingQuoteId = null; saveState(); render();
        } else if (action === "delete-quote") {
          var qdid = el.getAttribute("data-id");
          state.quotes = state.quotes.filter(function (q) { return q.id !== qdid; });
          if (editingQuoteId === qdid) editingQuoteId = null;
          saveState(); render();
        } else if (action === "add-manual") {
          var mt = document.getElementById("manual-fayu");
          var ms = document.getElementById("manual-source");
          var text = mt ? mt.value.trim() : "";
          var source = ms ? ms.value.trim() : "";
          if (!text) { fayuError = "先写下那句话。"; render(); return; }
          fayuError = "";
          state.quotes.unshift({ id: uid(), text: text, source: source, reflection: "" });
          saveState(); render();
          window.scrollTo(0, 0);
        } else if (action === "fav-talk") {
          var tid = el.getAttribute("data-id");
          var ti = state.talkFavIds.indexOf(tid);
          if (ti === -1) state.talkFavIds.push(tid); else state.talkFavIds.splice(ti, 1);
          saveState(); render();
        } else if (action === "breath-rhythm") {
          breathReset(); breathRhythm = el.getAttribute("data-id"); render();
        } else if (action === "breath-minutes") {
          breathReset(); breathMinutes = Number(el.getAttribute("data-min")); render();
        } else if (action === "breath-start") {
          breathRunning = true; breathFinished = false; render();
        } else if (action === "breath-pause") {
          breathRunning = false; breathStop(); render();
        } else if (action === "breath-reset") {
          breathReset(); render();
        } else if (action === "breath-log") {
          state.logs.unshift({ id: uid(), date: todayStr, kinds: ["正念"], minutes: breathMinutes, note: "正念呼吸 · " + BREATH_RHYTHMS[breathRhythm].label + " 节奏" });
          state.logs.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
          breathLogged = true;
          saveState(); render();
        } else if (action === "guide-toggle") {
          var gid = el.getAttribute("data-id");
          if (openGuideId === gid) { openGuideId = null; } else { openGuideId = gid; guideStep = 0; }
          render();
        } else if (action === "guide-next") {
          guideStep += 1; render();
        } else if (action === "guide-prev") {
          if (guideStep > 0) guideStep -= 1; render();
        } else if (action === "add-my-talk") {
          var mta = document.getElementById("my-talk");
          var mtext = mta ? mta.value.trim() : "";
          if (!mtext) { talkError = "先写一句话给自己。"; render(); return; }
          talkError = "";
          state.myTalks.unshift({ id: uid(), text: mtext });
          saveState(); render();
        } else if (action === "delete-my-talk") {
          var mdid = el.getAttribute("data-id");
          state.myTalks = state.myTalks.filter(function (t) { return t.id !== mdid; });
          saveState(); render();
        } else if (action === "add-reframe") {
          var rh = document.getElementById("reframe-harsh");
          var rk = document.getElementById("reframe-kind");
          var harsh = rh ? rh.value.trim() : "";
          var kind = rk ? rk.value.trim() : "";
          if (!harsh || !kind) { reframeError = "两栏都写上：原来的话，和换一种说法。"; render(); return; }
          reframeError = "";
          state.reframes.unshift({ id: uid(), harsh: harsh, kind: kind });
          saveState(); render();
        } else if (action === "delete-reframe") {
          var rdid = el.getAttribute("data-id");
          state.reframes = state.reframes.filter(function (r) { return r.id !== rdid; });
          saveState(); render();
        }
      });

      document.addEventListener("input", function (ev) {
        if (ev.target && ev.target.id === "minutes") {
          ev.target.value = ev.target.value.replace(/[^0-9]/g, "");
        }
      });

      loadState();
      render();
    </script>
  </body>
</html>
