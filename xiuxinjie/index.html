    <title>修心界</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #17121f;
        --surface: #221a30;
        --surface-2: #2a2140;
        --text: #e9e4f2;
        --dim: #a79ec0;
        --faint: #7e7398;
        --border: #372d4d;
        --accent: #8b7ab8;
        --accent-soft: #b3a6d4;
        --accent-deep: #4a3a6e;
        --amber: #d9a75a;
        --radius: 12px;
        --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: 96px; }
      button, a, section, .card { scroll-margin-bottom: 96px; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      .serif { font-family: var(--serif); }
      .wrap { max-width: 672px; margin: 0 auto; width: 100%; }
      main { padding-bottom: 104px; }
      .px { padding-left: 20px; padding-right: 20px; }
      h2.sec-title { font-family: var(--serif); font-size: 18px; font-weight: 600; margin: 0; }
      .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      button { font: inherit; cursor: pointer; background: none; border: none; color: inherit; }
      a { color: var(--accent-soft); }
      .chip {
        border-radius: 999px; border: 1px solid var(--border);
        padding: 8px 16px; font-size: 14px; color: var(--dim);
        background: transparent; transition: background .15s, color .15s;
        min-height: 40px;
      }
      .chip.on { border-color: var(--accent); background: var(--accent-deep); color: var(--text); }
      .chip.small { padding: 6px 14px; min-height: 36px; }
      .btn-primary {
        border-radius: 999px; background: var(--accent-deep); color: var(--text);
        padding: 10px 22px; font-size: 14px; font-weight: 500; min-height: 44px;
      }
      .btn-primary:disabled { opacity: .5; }
      .btn-ghost {
        border-radius: 999px; border: 1px solid var(--accent); color: var(--accent-soft);
        padding: 4px 14px; font-size: 14px; min-height: 36px;
      }
      .btn-ghost:disabled { border-color: var(--border); color: var(--faint); }
      .card { background: var(--surface); border-radius: var(--radius); padding: 16px; }
      input, textarea {
        font: inherit; font-size: 14px; color: var(--text);
        background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 8px 12px; width: 100%;
      }
      textarea { resize: vertical; }
      input::placeholder, textarea::placeholder { color: var(--faint); }
      label.flabel { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .err { color: var(--amber); font-size: 14px; margin-top: 8px; }

      /* hero */
      .hero { position: relative; overflow: hidden; }
      .hero img { display: block; width: 100%; height: 200px; object-fit: cover; object-position: center; }
      @media (min-width: 640px) { .hero img { height: 320px; } }
      .hero-shade {
        position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(23,18,31,.62) 0%, rgba(23,18,31,.38) 42%, rgba(23,18,31,.72) 78%, var(--bg) 99%);
      }
      .hero-body {
        position: absolute; inset-inline: 0; bottom: 0; padding: 0 20px 8px;
        text-shadow: 0 1px 14px rgba(23,18,31,.95), 0 0 3px rgba(23,18,31,.9);
      }
      .hero-date { font-size: 12px; letter-spacing: .3em; color: var(--accent-soft); margin: 0; }
      .hero-kicker { font-size: 12px; letter-spacing: .3em; color: var(--dim); margin: 4px 0 0; }
      .hero-quote { font-family: var(--serif); font-size: 26px; font-weight: 600; line-height: 1.35; margin: 8px 0 0; }
      @media (min-width: 640px) { .hero-quote { font-size: 30px; } }
      .hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px; font-size: 14px; }
      .hero-meta .src { color: var(--dim); }
      .hero-meta a { text-decoration: underline; text-decoration-color: var(--accent-deep); text-underline-offset: 4px; }

      .today-strip {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
        padding: 12px 0; margin-top: 16px;
      }

      /* lecture cards */
      .lecture { border-bottom: 1px solid var(--border); padding: 16px 0; }
      .lecture:last-child { border-bottom: none; }
      .lecture-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .lecture-title { font-family: var(--serif); font-size: 16px; font-weight: 600; line-height: 1.45; margin: 0; }
      .platform {
        flex-shrink: 0; border-radius: 999px; padding: 2px 8px; font-size: 12px;
        background: var(--surface-2); color: var(--dim);
      }
      .platform.done { background: var(--accent-deep); color: var(--accent-soft); }
      .lecture-format { font-size: 12px; color: var(--faint); margin: 4px 0 0; }
      .lecture-note { font-size: 14px; line-height: 1.7; color: var(--dim); margin: 8px 0 0; }
      .lecture-actions { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
      .listen-btn {
        border-radius: 999px; background: var(--accent-deep); color: var(--text);
        padding: 6px 16px; font-size: 14px; text-decoration: none; display: inline-block;
      }
      .done-toggle { font-size: 14px; color: var(--dim); padding: 6px 0; }
      .done-toggle.on { color: var(--amber); }

      /* stats */
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; margin-top: 24px; }
      .stat { background: var(--surface); border-radius: var(--radius); padding: 12px 4px; }
      .stat .num { font-family: var(--serif); font-size: 24px; font-weight: 600; margin: 0; }
      .stat .num.amber { color: var(--amber); }
      .stat .lbl { font-size: 12px; color: var(--dim); margin: 2px 0 0; }

      /* calendar */
      .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; color: var(--faint); }
      .cal-week span { padding: 4px 0; }
      .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .cal-day {
        aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        border-radius: 8px; font-size: 14px; color: var(--dim);
      }
      .cal-day.practiced { background: var(--accent-deep); color: var(--text); }
      .cal-day.today { border: 1px solid var(--amber); color: var(--text); }
      .cal-day .dot { width: 4px; height: 4px; border-radius: 999px; background: var(--amber); margin-top: 2px; }
      .cal-nav-btn { border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--dim); min-height: 32px; }
      .cal-nav-btn:disabled { opacity: .4; }

      /* log & quote lists */
      .log-item, .quote-item { border-bottom: 1px solid var(--border); padding: 14px 0; }
      .log-item:last-child, .quote-item:last-child { border-bottom: none; }
      .log-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      .log-main { font-size: 14px; font-weight: 500; margin: 0; }
      .log-kinds { color: var(--accent-soft); margin-left: 8px; }
      .log-mins { color: var(--dim); margin-left: 8px; font-weight: 400; }
      .log-actions { display: flex; gap: 12px; flex-shrink: 0; font-size: 14px; }
      .log-actions button { color: var(--dim); padding: 4px 0; }
      .log-actions .del { color: var(--faint); }
      .log-note { font-size: 14px; line-height: 1.7; color: var(--dim); white-space: pre-wrap; margin: 6px 0 0; }
      .quote-text { font-family: var(--serif); font-size: 18px; font-weight: 600; line-height: 1.6; margin: 0; }
      .quote-text.small { font-size: 16px; }
      .quote-src { font-size: 14px; color: var(--dim); margin: 4px 0 0; }
      .reflection {
        font-size: 14px; line-height: 1.7; color: var(--dim); white-space: pre-wrap;
        border-left: 2px solid var(--accent-deep); padding-left: 12px; margin: 8px 0 0;
      }
      .quote-actions { display: flex; gap: 16px; margin-top: 8px; font-size: 14px; }
      .quote-actions .edit { color: var(--accent-soft); }
      .quote-actions .del { color: var(--faint); }
      .edit-actions { display: flex; gap: 8px; margin-top: 8px; }
      .edit-actions .save { border-radius: 999px; background: var(--accent-deep); padding: 6px 16px; font-size: 14px; color: var(--text); }
      .edit-actions .cancel { border-radius: 999px; border: 1px solid var(--border); padding: 6px 16px; font-size: 14px; color: var(--dim); }

      .empty { padding: 16px 0; font-size: 14px; line-height: 1.8; color: var(--dim); }
      .empty.center { text-align: center; padding: 24px 0; }
      .foot-note { text-align: center; font-size: 12px; line-height: 1.7; color: var(--faint); padding: 8px 20px 0; }
      .dim { color: var(--dim); font-size: 14px; line-height: 1.7; }
      .amber-text { color: var(--amber); }

      /* bottom nav */
      nav.bottom {
        position: fixed; inset-inline: 0; bottom: 0; z-index: 20;
        border-top: 1px solid var(--border); background: var(--bg);
        padding-bottom: env(safe-area-inset-bottom);
      }
      nav.bottom .wrap { display: grid; grid-template-columns: repeat(4, 1fr); }
      .nav-btn {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: 10px 0; font-size: 12px; color: var(--faint); min-height: 56px;
      }
      .nav-btn .glyph { font-family: var(--serif); font-size: 18px; line-height: 1; }
      .nav-btn.active { color: var(--accent-soft); }
      .nav-btn.active .lbl { font-weight: 500; }

      /* 正念模块 */
      .breath-stage { display:flex; flex-direction:column; align-items:center; padding: 20px 0 8px; }
      .breath-circle {
        width: 168px; height: 168px; border-radius: 999px;
        background: radial-gradient(circle at 50% 42%, #5a4a86 0%, #4a3a6e 58%, #3a2d58 100%);
        border: 1px solid var(--accent);
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
        transition: transform 1s linear;
        will-change: transform;
      }
      .breath-phase { font-family: var(--serif); font-size: 22px; font-weight:600; }
      .breath-count { font-size: 13px; color: var(--accent-soft); min-height: 18px; }
      .breath-progress { font-size: 13px; color: var(--dim); margin-top: 14px; min-height: 20px; text-align:center; }
      .talk-daily { background: var(--surface-2); border-radius: var(--radius); padding: 20px 16px; text-align:center; }
      .talk-daily .talk-text { font-family: var(--serif); font-size: 20px; font-weight:600; line-height:1.6; margin: 8px 0 0; }
      .guide-card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-top: 12px; }
      .guide-step { font-size: 15px; line-height: 1.8; background: var(--bg); border-radius: var(--radius); padding: 14px; margin-top: 12px; min-height: 76px; }
      .talk-item { border-bottom: 1px solid var(--border); padding: 12px 0; }
      .talk-item:last-child { border-bottom: none; }
      .talk-item .t-text { font-family: var(--serif); font-size: 16px; line-height: 1.6; margin: 0; }
      .reframe-pair { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; margin-top: 12px; }
      .reframe-pair .harsh { font-size: 14px; color: var(--faint); line-height:1.7; margin:0; }
      .reframe-pair .kind { font-family: var(--serif); font-size: 16px; line-height:1.7; margin: 6px 0 0; color: var(--text); }
      .sec-sub { font-size: 14px; font-weight: 500; color: var(--accent-soft); margin: 0 0 4px; }

      /* 同修共参 */
      .teacher-block { margin-top: 28px; }
      .teacher-name { font-family: var(--serif); font-size: 17px; font-weight: 600; margin: 0; }
      .teacher-role { font-size: 12px; letter-spacing: .12em; color: var(--amber); margin: 4px 0 0; }
      .teacher-intro { font-size: 14px; line-height: 1.7; color: var(--dim); margin: 6px 0 0; }

      /* PWA 安装 */
      .install-bar {
        position: fixed; inset-inline: 0; bottom: calc(57px + env(safe-area-inset-bottom)); z-index: 19;
        padding: 0 12px; pointer-events: none;
      }
      .install-card {
        pointer-events: auto; max-width: 672px; margin: 0 auto;
        display: flex; align-items: center; gap: 12px;
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
        padding: 12px 14px; box-shadow: 0 10px 32px rgba(0,0,0,.45);
      }
      .install-card img { width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0; }
      .install-card .it { flex: 1; min-width: 0; }
      .install-card .it p { margin: 0; }
      .install-card .it .t1 { font-family: var(--serif); font-size: 15px; font-weight: 600; }
      .install-card .it .t2 { font-size: 13px; color: var(--dim); line-height: 1.5; margin-top: 2px; }
      .install-card .it .t2 .share-glyph { color: var(--accent-soft); font-weight: 600; }
      .install-go {
        flex-shrink: 0; border-radius: 999px; background: var(--amber); color: #241a08;
        padding: 9px 18px; font-size: 14px; font-weight: 600; min-height: 40px;
      }
      .install-close {
        flex-shrink: 0; align-self: flex-start; color: var(--faint); font-size: 18px;
        line-height: 1; padding: 2px 4px;
      }
      .install-entry {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        width: 100%; margin-top: 14px; padding: 11px 16px;
        border: 1px solid var(--border); border-radius: var(--radius);
        font-size: 14px; color: var(--accent-soft); background: var(--surface);
        min-height: 48px;
      }
      .install-entry img { width: 22px; height: 22px; border-radius: 5px; }
      /* 已安装（独立窗口）时：顶部留出状态栏安全区 */
      @media (display-mode: standalone) {
        body { padding-top: env(safe-area-inset-top); }
      }
      body.has-install-bar main { padding-bottom: 184px; }

      /* 晨修三分钟 */
      .morning-card {
        background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
        padding: 20px 18px; margin-top: 16px;
      }
      .morning-kicker { font-size: 12px; letter-spacing: .28em; color: var(--amber); margin: 0; }
      .morning-title { font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1.35; margin: 8px 0 0; }
      .morning-desc { font-size: 14px; line-height: 1.7; color: var(--dim); margin: 8px 0 0; }
      .morning-steps-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      .morning-steps-preview span {
        font-size: 13px; color: var(--dim); border: 1px solid var(--border); border-radius: 999px; padding: 6px 10px;
      }
      .morning-steps-preview b { color: var(--text); font-weight: 600; }
      .morning-start-btn {
        width: 100%; margin-top: 16px; border-radius: 999px; background: var(--amber); color: #241a08;
        font-size: 16px; font-weight: 700; padding: 13px 20px; min-height: 52px;
      }
      .morning-intention-saved {
        margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--bg);
        font-size: 14px; line-height: 1.6; color: var(--dim);
      }
      .morning-intention-saved b { color: var(--text); font-family: var(--serif); }
      .morning-daily {
        margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
      }
      .morning-daily-label {
        display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px;
        font-size: 12px; letter-spacing: .22em; color: var(--amber); margin: 0;
      }
      .morning-daily-label .date { letter-spacing: .08em; color: var(--faint); }
      .morning-daily .morning-quote { text-align: left; font-size: 20px; margin-top: 10px; }
      .morning-daily .morning-src { text-align: left; margin-top: 6px; }
      .morning-daily-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 10px; font-size: 14px; }
      .morning-daily-actions a { text-decoration: underline; text-decoration-color: var(--accent-deep); text-underline-offset: 4px; }
      .morning-progress-track { height: 6px; border-radius: 999px; background: var(--bg); overflow: hidden; margin-top: 14px; }
      .morning-progress-bar { height: 100%; background: var(--amber); border-radius: 999px; transition: width .2s linear; }
      .morning-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--faint); margin-top: 8px; }
      .morning-step-label { font-size: 12px; letter-spacing: .22em; color: var(--amber); margin: 18px 0 0; text-align: center; }
      .morning-quote { font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.55; text-align: center; margin: 12px 0 0; }
      .morning-src { text-align: center; font-size: 13px; color: var(--dim); margin: 8px 0 0; }
      .morning-hint { text-align: center; font-size: 13px; line-height: 1.7; color: var(--faint); margin: 10px 0 0; }
      .morning-remaining { text-align: center; font-size: 13px; color: var(--dim); margin-top: 12px; min-height: 20px; }
      .morning-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin-top: 16px; }
      .morning-exit { font-size: 13px; color: var(--faint); padding: 8px 6px; text-decoration: underline; text-underline-offset: 3px; }
      .morning-done-icon {
        width: 52px; height: 52px; border-radius: 999px; margin: 4px auto 0;
        background: var(--accent-deep); color: var(--amber); display: flex; align-items: center; justify-content: center;
        font-size: 26px; font-family: var(--serif);
      }

      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>

          if (parsed && Array.isArray(parsed.logs)) state.logs = parsed.logs;
          if (parsed && Array.isArray(parsed.quotes)) state.quotes = parsed.quotes;
          if (parsed && Array.isArray(parsed.doneLectureIds)) state.doneLectureIds = parsed.doneLectureIds;
          if (parsed && Array.isArray(parsed.talkFavIds)) state.talkFavIds = parsed.talkFavIds;

          if (parsed && Array.isArray(parsed.reframes)) state.reframes = parsed.reframes;

        } catch (e) { /* 存储不可用时静默降级为内存状态 */ }

        try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 同上 */ }

      /* ============ 渲染：晨修三分钟 ============ */

      }
      function renderMorningCard(todayStr, fayu, talk) {
        var intentionToday = (state.morningIntentions && state.morningIntentions[todayStr]) || "";
        var loggedToday = state.morningLoggedDates.indexOf(todayStr) !== -1 || morningLogged;
        var rhythm = BREATH_RHYTHMS["446"];
        var h = "";
        h += '<section class="morning-card" aria-label="晨修三分钟">';

          if (intentionToday || morningIntentionDraft) {

          }
          h += '<div class="morning-controls">';
          if (!loggedToday) {
            h += '<button type="button" class="btn-primary" data-action="morning-log">记入修行记录 · 正念 3 分钟</button>';
          } else {
            h += '<span class="dim" style="align-self:center;">已记入修行记录 ✓</span>';

          h += '<button type="button" class="morning-exit" data-action="morning-close">回到今日</button>';
          h += '</div>';
          return h + "</section>";
        }
        if (!morningActive) {
          var fayuSavedIdle = state.quotes.some(function (q) { return q.text === fayu.text; });
          var dailyDate = parseDateStr(todayStr);
          var dailyDateLine = dailyDate.getFullYear() + " 年 " + (dailyDate.getMonth() + 1) + " 月 " + dailyDate.getDate() + " 日 · 星期" + WEEKDAYS[dailyDate.getDay()];
          h += '<p class="morning-kicker">晨间三分钟 · MORNING</p>';
          h += '<h2 class="morning-title">早上好，先静一静</h2>';
          h += '<p class="morning-desc">不用准备，也不用盘腿。读一句开示，跟两分钟呼吸，再留一句给今天——三分钟，一个能坚持的开始。</p>';
          h += '<div class="morning-steps-preview"><span><b>1</b> 开示静读 · 30 秒</span><span><b>2</b> 跟呼吸 · 2 分钟</span><span><b>3</b> 今日一句 · 30 秒</span></div>';

          if (intentionToday) {

      /* ============ 渲染：听经台 ============ */

      function renderLectures() {
        var visible = lectureTopic === "全部" ? LECTURES : LECTURES.filter(function (l) { return l.topic === lectureTopic; });
        var html = '<div class="px" style="padding-top:24px;">';
        html += '<div class="sec-head"><h2 class="sec-title">听经台</h2><span class="dim">已听完 ' + state.doneLectureIds.length + " / " + LECTURES.length + "</span></div>";
        html += '<p class="dim" style="margin:-4px 0 16px;">体佛法师的讲经与开示，按经与主题整理，是这里的主线。点开即去原站收听——法师常提醒：听经要听完整，不要断章取义。页面下方另有「同修共参」，收四位方向相近的大德。</p>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;" role="group" aria-label="按主题筛选课程">';
        ["全部"].concat(LECTURE_TOPICS).forEach(function (t) {
          html += '<button type="button" class="chip small' + (lectureTopic === t ? " on" : "") + '" data-action="topic" data-topic="' + t + '" aria-pressed="' + (lectureTopic === t) + '">' + t + "</button>";
        });
        html += "</div><div>";
        visible.forEach(function (l) { html += lectureCardHTML(l); });
        html += "</div>";
        html += '<p style="text-align:center;font-size:14px;color:var(--dim);padding:24px 0;">更多讲经视频与讲义：<a href="' + MORE_RESOURCES_URL + '" target="_blank" rel="noreferrer" style="text-decoration:underline;text-decoration-color:var(--accent-deep);text-underline-offset:4px;">吉验文化 · 体佛法师专页</a></p>';
        html += renderTeachers();
        html += "</div>";
        return html;
      }

      /* ============ 渲染：修行记录 ============ */

      function renderPractice(todayStr) {
        var practicedDates = new Set(state.logs.map(function (l) { return l.date; }));
        var streak = computeStreak(practicedDates, todayStr);
        var totalMinutes = state.logs.reduce(function (s, l) { return s + (l.minutes || 0); }, 0);

        var base = new Date();
        var viewDate = new Date(base.getFullYear(), base.getMonth() + monthOffset, 1);
        var vy = viewDate.getFullYear(), vm = viewDate.getMonth();
        var daysInMonth = new Date(vy, vm + 1, 0).getDate();
        var firstWeekday = viewDate.getDay();
        var cells = [];
        for (var i = 0; i < firstWeekday; i++) cells.push(null);
        for (var d = 1; d <= daysInMonth; d++) cells.push(toDateStr(new Date(vy, vm, d)));

        var html = '<div class="px" style="padding-top:24px;">';
        html += '<div class="sec-head"><h2 class="sec-title">修行记录</h2></div>';

        /* 打卡表单 */
        html += '<section class="card" aria-label="记录今日修行">';
        html += '<p class="dim" style="margin:0 0 12px;">今天修行了吗？记下来。</p>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:8px;" role="group" aria-label="修行方式">';
        PRACTICE_KINDS.forEach(function (k) {
          var on = formKinds.indexOf(k) !== -1;
          html += '<button type="button" class="chip' + (on ? " on" : "") + '" data-action="kind" data-kind="' + k + '" aria-pressed="' + on + '">' + k + "</button>";
        });
        html += "</div>";
        html += '<div style="display:flex;align-items:flex-end;gap:12px;margin-top:16px;flex-wrap:wrap;">';
        html += '<div style="width:112px;"><label class="flabel" for="minutes">时长（分钟，可空）</label><input id="minutes" inputmode="numeric" placeholder="如 20" value="' + esc(formMinutes) + '" /></div>';
        html += '<button type="button" class="btn-primary" data-action="add-log">记一笔</button>';
        html += "</div>";
        html += '<div style="margin-top:12px;"><label class="flabel" for="new-note">心得（可空）</label><textarea id="new-note" rows="2" placeholder="坐完这一会儿，心是定的还是散的……">' + esc(formNote) + "</textarea></div>";
        if (formError) html += '<p class="err" role="alert">' + esc(formError) + "</p>";
        html += "</section>";

        /* 概览 */
        html += '<section class="stats" aria-label="修行概览">';
        html += '<div class="stat"><p class="num amber">' + streak + '</p><p class="lbl">连续天数</p></div>';
        html += '<div class="stat"><p class="num">' + state.logs.length + '</p><p class="lbl">累计次数</p></div>';
        html += '<div class="stat"><p class="num">' + totalMinutes + '</p><p class="lbl">累计分钟</p></div>';
        html += "</section>";

        /* 日历 */
        html += '<section aria-label="修行日历" style="margin-top:24px;">';
        html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">';
        html += '<h3 class="serif" style="font-size:16px;font-weight:600;margin:0;">' + vy + " 年 " + (vm + 1) + " 月</h3>";
        html += '<div style="display:flex;gap:8px;">' +
          '<button type="button" class="cal-nav-btn" data-action="month" data-dir="-1" aria-label="上个月">‹</button>' +
          '<button type="button" class="cal-nav-btn" data-action="month" data-dir="0"' + (monthOffset === 0 ? " disabled" : "") + '>本月</button>' +
          '<button type="button" class="cal-nav-btn" data-action="month" data-dir="1"' + (monthOffset >= 0 ? " disabled" : "") + ' aria-label="下个月">›</button>' +
          "</div></div>";
        html += '<div class="cal-week">' + WEEKDAYS.map(function (w) { return "<span>" + w + "</span>"; }).join("") + "</div>";
        html += '<div class="cal-grid">';
        cells.forEach(function (ds) {
          if (ds === null) { html += "<span></span>"; return; }
          var practiced = practicedDates.has(ds);
          var cls = "cal-day" + (practiced ? " practiced" : "") + (ds === todayStr ? " today" : "");
          html += '<div class="' + cls + '" aria-label="' + ds + (practiced ? "，已修行" : "") + '">' + parseDateStr(ds).getDate() + (practiced ? '<span class="dot"></span>' : "") + "</div>";
        });
        html += "</div></section>";

        /* 历史 */
        html += '<section aria-label="修行历史" style="margin-top:24px;">';
        html += '<div class="sec-head"><h2 class="sec-title">历史</h2></div>';
        if (state.logs.length === 0) {
          html += '<p class="empty center">还没有记录。<br />第一次修行，从上面记下第一笔开始。</p>';
        } else {
          html += "<div>";
          state.logs.slice(0, 60).forEach(function (log) {
            html += '<div class="log-item">';
            html += '<div class="log-head"><p class="log-main">' + friendlyDate(log.date, todayStr) +
              '<span class="log-kinds">' + esc(log.kinds.join(" · ")) + "</span>" +
              (log.minutes != null ? '<span class="log-mins">' + log.minutes + " 分钟</span>" : "") + "</p>";
            html += '<div class="log-actions">' +
              '<button type="button" data-action="edit-log" data-id="' + log.id + '">' + (editingLogId === log.id ? "收起" : (log.note ? "编辑心得" : "写心得")) + "</button>" +
              '<button type="button" class="del" data-action="delete-log" data-id="' + log.id + '">删除</button></div></div>';
            if (log.note && editingLogId !== log.id) {
              html += '<p class="log-note">' + esc(log.note) + "</p>";
            }
            if (editingLogId === log.id) {
              html += '<div style="margin-top:8px;"><label class="sr-only" for="log-note-' + log.id + '">修行心得</label>' +
                '<textarea id="log-note-' + log.id + '" rows="3" placeholder="这一坐 / 这一课，心里有什么变化……">' + esc(log.note || "") + "</textarea>" +
                '<div class="edit-actions"><button type="button" class="save" data-action="save-log-note" data-id="' + log.id + '">保存心得</button>' +
                '<button type="button" class="cancel" data-action="cancel-edit-log">取消</button></div></div>';
            }
            html += "</div>";
          });
          html += "</div>";
          if (state.logs.length > 60) {
            html += '<p style="text-align:center;font-size:12px;color:var(--faint);padding:8px 0;">只显示最近 60 条 · 共 ' + state.logs.length + " 条</p>";
          }
        }
        html += "</section></div>";
        return html;
      }

      /* ============ 渲染：开示小筑 ============ */

      function renderFayu() {
        var savedTexts = new Set(state.quotes.map(function (q) { return q.text; }));

      /* ============ 渲染：正念 · 对自己说的话 ============ */

      function fmtClock(sec) {
        sec = Math.max(0, Math.round(sec));
        return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
      }

        html += '<div class="breath-stage"><div class="breath-circle" id="breath-circle"><span class="breath-phase" id="breath-phase">' + (breathFinished ? "完成" : breathRunning ? esc(rhythm.phases[breathPhaseIdx].name) : "准备") + '</span><span class="breath-count" id="breath-count">' + (breathRunning ? Math.ceil(rhythm.phases[breathPhaseIdx].sec - breathPhaseElapsed) + " 秒" : breathFinished ? "辛苦了" : "跟着圆圈呼吸") + "</span></div>";
        html += '<p class="breath-progress" id="breath-progress">' + (breathFinished ? "这一轮呼吸完成了。" : "已练习 " + fmtClock(breathTotalElapsed) + " / " + fmtClock(totalSec)) + "</p></div>";

        /* 正念小练习 */
        html += '<section aria-label="正念小练习" style="margin-top:28px;">';

        html += '<p class="dim" style="margin:0;">不用盘腿，不用清空脑袋——跟着一步步做，就是正念。</p>';
        GUIDES.forEach(function (g) {
          var open = openGuideId === g.id;
          html += '<div class="guide-card"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;"><h4 style="font-family:var(--serif);font-size:16px;margin:0;">' + esc(g.title) + '</h4><button type="button" data-action="guide-toggle" data-id="' + g.id + '" style="font-size:14px;color:var(--accent-soft);flex-shrink:0;">' + (open ? "收起" : "开始") + "</button></div>";

            html += '<button type="button" class="btn-ghost" data-action="guide-prev"' + (step === 0 ? " disabled" : "") + ">上一步</button>";
            if (step < g.steps.length - 1) html += '<button type="button" class="btn-ghost" data-action="guide-next">下一步</button>';
            else html += '<button type="button" class="btn-ghost" data-action="guide-toggle" data-id="' + g.id + '">完成 ✓</button>';
            html += "</div></div>";
          }
          html += "</div>";

        html += "</section>";

        /* 正向自我对话 · 语句库 */
        html += '<section aria-label="对自己说的话" style="margin-top:28px;">';

        html += '<p class="dim" style="margin:0 0 4px;">平和、可信、不夸张的话——心烦时翻一翻，喜欢的收起来。</p><div>';
        SELF_TALK.forEach(function (s) {
          var fav = state.talkFavIds.indexOf(s.id) !== -1;
          html += '<div class="talk-item"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;"><p class="t-text">' + esc(s.text) + '</p><button type="button" data-action="fav-talk" data-id="' + s.id + '" aria-pressed="' + fav + '" style="font-size:18px;color:' + (fav ? "var(--amber)" : "var(--faint)") + ';flex-shrink:0;padding:2px 4px;" aria-label="' + (fav ? "取消收藏" : "收藏") + '">' + (fav ? "♥" : "♡") + "</button></div></div>";
        });
        html += "</div>";
        if (state.talkFavIds.length > 0) html += '<p style="font-size:13px;color:var(--faint);margin:8px 0 0;">已收藏 ' + state.talkFavIds.length + " 句</p>";
        html += "</section>";

        /* 我写给自己的话 */
        html += '<section class="card" aria-label="我写给自己的话" style="margin-top:24px;">';
        html += '<h3 style="font-size:14px;font-weight:500;margin:0 0 12px;">我写给自己的话</h3>';
        html += '<label class="sr-only" for="my-talk">写一句给自己的话</label><textarea id="my-talk" rows="2" placeholder="用你会对好朋友说话的语气，写一句给自己……"></textarea>';
        if (talkError) html += '<p class="err" role="alert">' + esc(talkError) + "</p>";
        html += '<button type="button" class="btn-primary" data-action="add-my-talk" style="margin-top:12px;min-height:40px;padding:8px 20px;">存下来</button>';
        if (state.myTalks.length > 0) {
          html += "<div style='margin-top:8px;'>";
          state.myTalks.forEach(function (t) {
            html += '<div class="talk-item"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;"><p class="t-text">' + esc(t.text) + '</p><button type="button" data-action="delete-my-talk" data-id="' + t.id + '" style="font-size:13px;color:var(--faint);flex-shrink:0;padding:4px 0;">删除</button></div></div>';
          });
          html += "</div>";
        }
        html += "</section>";

        /* 换一句话说 */
        html += '<section aria-label="换一句话说" style="margin-top:28px;">';

        html += '<p class="dim" style="margin:0;">脑子里那句苛责自己的话，先原样写下来，再试着用温和、真实的方式改写它。改写不是骗自己，是把话说全、说准。</p>';
        html += '<div class="card" style="margin-top:12px;">';
        html += '<label class="flabel" for="reframe-harsh">心里那句苛责的话</label><textarea id="reframe-harsh" rows="2" placeholder="如：我怎么什么都做不好……"></textarea>';
        html += '<label class="flabel" for="reframe-kind" style="margin-top:12px;">换一句话说（温和版）</label><textarea id="reframe-kind" rows="2" placeholder="如：这件事我没做好，但我也有做好的事，我可以慢慢改。"></textarea>';
        if (reframeError) html += '<p class="err" role="alert">' + esc(reframeError) + "</p>";
        html += '<button type="button" class="btn-primary" data-action="add-reframe" style="margin-top:12px;min-height:40px;padding:8px 20px;">存下这一对</button>';
        html += "</div>";
        state.reframes.forEach(function (r) {
          html += '<div class="reframe-pair"><p class="harsh">原来的话：' + esc(r.harsh) + '</p><p class="kind">' + esc(r.kind) + '</p><div style="text-align:right;"><button type="button" data-action="delete-reframe" data-id="' + r.id + '" style="font-size:13px;color:var(--faint);padding:4px 0;">删除</button></div></div>';
        });
        html += "</section></div>";
        return html;
      }

      /* ============ 晨修计时 ============ */

      function morningStopTimer() {
        if (morningTimer) { clearInterval(morningTimer); morningTimer = null; }
      }
      function morningResetBreath() {
        morningBreathPhaseIdx = 0; morningBreathPhaseElapsed = 0;
      }
      function morningCaptureIntention() {
        var el = document.getElementById("morning-intention");
        if (el) morningIntentionDraft = el.value;
      }
      function morningFinish() {
        morningStopTimer();
        morningActive = false; morningPaused = false; morningFinished = true;
        morningStepElapsed = 0;
        render();
      }
      function morningGoStep(nextStep) {
        morningStep = Math.max(0, Math.min(2, nextStep));
        morningStepElapsed = 0;
        if (morningStep === 1) morningResetBreath();
      }
      function morningTick() {
        if (!morningActive || morningPaused) return;
        morningStepElapsed += 0.1;
        morningTotalElapsed += 0.1;
        if (morningStep === 1) {
          var rhythm = BREATH_RHYTHMS["446"];
          var phase = rhythm.phases[morningBreathPhaseIdx];
          morningBreathPhaseElapsed += 0.1;
          if (morningBreathPhaseElapsed >= phase.sec) {
            morningBreathPhaseElapsed = 0;
            morningBreathPhaseIdx = (morningBreathPhaseIdx + 1) % rhythm.phases.length;
            phase = rhythm.phases[morningBreathPhaseIdx];
          }
          var circle = document.getElementById("morning-circle");
          if (!circle) { /* 视图已切换 */ }
          else if (!prefersReducedMotion()) {
            var p = Math.min(1, morningBreathPhaseElapsed / phase.sec);
            var scale = phase.from + (phase.to - phase.from) * p;
            circle.style.transitionDuration = "0.12s";
            circle.style.transform = "scale(" + scale.toFixed(3) + ")";
          }
          var phEl = document.getElementById("morning-phase");
          var ctEl = document.getElementById("morning-count");
          if (phEl) phEl.textContent = phase.name;
          if (ctEl) ctEl.textContent = Math.ceil(phase.sec - morningBreathPhaseElapsed) + " 秒";
        }
        if (morningStepElapsed >= MORNING_DURATIONS[morningStep]) {
          if (morningStep < 2) {
            if (morningStep === 2) morningCaptureIntention();
            morningGoStep(morningStep + 1);
            render();
            return;
          } else {
            morningCaptureIntention();
            /* 若第三步已输入意向，自动存下 */
            var todayS = toDateStr(new Date());
            var draft = (morningIntentionDraft || "").trim();
            if (draft) { state.morningIntentions[todayS] = draft; saveState(); }
            morningFinish();
            return;
          }
        }
        var bar = document.getElementById("morning-progress-bar");
        var elap = document.getElementById("morning-elapsed");
        var rem = document.getElementById("morning-remaining");
        if (bar) bar.style.width = Math.min(100, (morningTotalElapsed / MORNING_TOTAL) * 100) + "%";
        if (elap) elap.textContent = fmtClock(morningTotalElapsed) + " / 3:00";
        if (rem) rem.textContent = "这一步还剩 " + Math.max(0, Math.ceil(MORNING_DURATIONS[morningStep] - morningStepElapsed)) + " 秒 · 到时自动进入下一步";
        if (!document.getElementById("morning-circle") && morningStep === 1) { /* 已离开今日页 */ morningStopTimer(); }
      }
      function morningStartTimer() {
        morningStopTimer();
        morningTimer = setInterval(morningTick, 100);
      }
      function morningResetAll() {
        morningStopTimer();
        morningActive = false; morningFinished = false; morningPaused = false;
        morningStep = 0; morningStepElapsed = 0; morningTotalElapsed = 0;
        morningResetBreath(); morningError = "";
      }

      /* ============ 呼吸计时 ============ */

      function breathTick() {
        var rhythm = BREATH_RHYTHMS[breathRhythm];
        var phase = rhythm.phases[breathPhaseIdx];
        breathPhaseElapsed += 0.1;
        breathTotalElapsed += 0.1;
        var totalSec = breathMinutes * 60;
        if (breathTotalElapsed >= totalSec) {
          breathStop();
          breathFinished = true; breathRunning = false;
          breathPhaseElapsed = 0; breathTotalElapsed = totalSec;
          render();
          return;
        }
        if (breathPhaseElapsed >= phase.sec) {
          breathPhaseElapsed = 0;
          breathPhaseIdx = (breathPhaseIdx + 1) % rhythm.phases.length;
          phase = rhythm.phases[breathPhaseIdx];
        }
        var circle = document.getElementById("breath-circle");
        var phaseEl = document.getElementById("breath-phase");
        var countEl = document.getElementById("breath-count");
        var progEl = document.getElementById("breath-progress");
        if (!circle) { breathStop(); return; }
        var p = Math.min(1, breathPhaseElapsed / phase.sec);
        var scale = phase.from + (phase.to - phase.from) * p;
        circle.style.transitionDuration = "0.12s";
        circle.style.transform = "scale(" + scale.toFixed(3) + ")";
        if (phaseEl) phaseEl.textContent = phase.name;
        if (countEl) countEl.textContent = Math.ceil(phase.sec - breathPhaseElapsed) + " 秒";
        if (progEl) progEl.textContent = "已练习 " + fmtClock(breathTotalElapsed) + " / " + fmtClock(totalSec);
      }
      function breathStartTimer() {
        breathStop();
        breathTimer = setInterval(breathTick, 100);
        var circle = document.getElementById("breath-circle");
        var rhythm = BREATH_RHYTHMS[breathRhythm];
        var phase = rhythm.phases[breathPhaseIdx];
        if (circle) {
          var p = Math.min(1, breathPhaseElapsed / phase.sec);
          circle.style.transform = "scale(" + (phase.from + (phase.to - phase.from) * p).toFixed(3) + ")";
        }
      }
      function breathStop() {
        if (breathTimer) { clearInterval(breathTimer); breathTimer = null; }
      }
      function breathReset() {
        breathStop();
        breathRunning = false; breathFinished = false; breathLogged = false;
        breathPhaseIdx = 0; breathPhaseElapsed = 0; breathTotalElapsed = 0;
      }

      /* ============ 主渲染 ============ */

      var view = document.getElementById("view");
      var tabbar = document.getElementById("tabbar");

      function render() {
        var todayStr = toDateStr(new Date());
        tabbar.innerHTML = TABS.map(function (t) {
          return '<button type="button" class="nav-btn' + (tab === t.id ? " active" : "") + '" data-action="goto" data-tab="' + t.id + '" aria-pressed="' + (tab === t.id) + '" aria-label="切换到' + t.label + '"><span class="glyph" aria-hidden="true">' + t.glyph + '</span><span class="lbl">' + t.label + "</span></button>";
        }).join("");

        if (tab === "today") view.innerHTML = renderToday(todayStr);
        else if (tab === "lectures") view.innerHTML = renderLectures();
        else if (tab === "practice") view.innerHTML = renderPracticeFayu(todayStr);
        else view.innerHTML = renderMindful(todayStr);
        if (tab === "mindful" && breathRunning) breathStartTimer();
        if (tab === "today" && morningActive && !morningPaused) morningStartTimer();
        if (tab === "today" && morningActive && morningStep === 1 && !prefersReducedMotion()) {
          var mc = document.getElementById("morning-circle");
          if (mc) { var mr = BREATH_RHYTHMS["446"]; var mph = mr.phases[morningBreathPhaseIdx]; var mp = Math.min(1, morningBreathPhaseElapsed / mph.sec); mc.style.transform = "scale(" + (mph.from + (mph.to - mph.from) * mp).toFixed(3) + ")"; }
        }
      }

      function saveFayuById(id) {
        var f = null;
        for (var i = 0; i < FAYU_JINGXUAN.length; i++) if (FAYU_JINGXUAN[i].id === id) f = FAYU_JINGXUAN[i];
        if (!f) return;
        if (state.quotes.some(function (q) { return q.text === f.text; })) return;
        state.quotes.unshift({ id: uid(), text: f.text, source: f.source, reflection: "" });
        saveState();
      }

      /* ============ 事件处理 ============ */

      document.addEventListener("click", function (ev) {
        var el = ev.target.closest ? ev.target.closest("[data-action]") : null;
        if (!el) return;
        var action = el.getAttribute("data-action");
        var todayStr = toDateStr(new Date());

        if (action === "morning-start") {
          morningResetAll();
          morningActive = true; morningPaused = false; morningFinished = false;
          morningLogged = state.morningLoggedDates.indexOf(todayStr) !== -1;
          morningIntentionDraft = (state.morningIntentions && state.morningIntentions[todayStr]) || "";
          render(); window.scrollTo(0, 0);
        } else if (action === "morning-pause") {
          morningCaptureIntention();
          if (morningPaused) { morningPaused = false; render(); }
          else { morningPaused = true; morningStopTimer(); render(); }
        } else if (action === "morning-next") {
          morningCaptureIntention();
          if (morningStep === 2) {
            var draftN = (morningIntentionDraft || "").trim();
            if (draftN) { state.morningIntentions[todayStr] = draftN; saveState(); }
            morningFinish();
          } else {
            /* 把已走的时间补到总时长，避免手动跳步后进度条回退太多：总时长按步进估算 */
            var elapsedBefore = 0; for (var si = 0; si < morningStep; si++) elapsedBefore += MORNING_DURATIONS[si];
            morningTotalElapsed = Math.max(morningTotalElapsed, elapsedBefore + MORNING_DURATIONS[morningStep]);
            if (morningTotalElapsed > MORNING_TOTAL) morningTotalElapsed = MORNING_TOTAL - MORNING_DURATIONS[2];
            morningGoStep(morningStep + 1);
            render();
          }
        } else if (action === "morning-prev") {
          morningCaptureIntention();
          if (morningStep > 0) {
            var elapsedPrev = 0; for (var pi = 0; pi < morningStep - 1; pi++) elapsedPrev += MORNING_DURATIONS[pi];
            morningTotalElapsed = elapsedPrev;
            morningGoStep(morningStep - 1);
            render();
          }
        } else if (action === "morning-exit") {
          morningResetAll();
          morningIntentionDraft = "";
          render(); window.scrollTo(0, 0);
        } else if (action === "morning-close") {
          morningFinished = false; morningResetAll(); render(); window.scrollTo(0, 0);
        } else if (action === "morning-restart") {
          morningResetAll();
          morningActive = true; morningPaused = false;
          morningIntentionDraft = (state.morningIntentions && state.morningIntentions[todayStr]) || "";
          render(); window.scrollTo(0, 0);
        } else if (action === "morning-save-intention") {
          morningCaptureIntention();
          var draftS = (morningIntentionDraft || "").trim();
          if (!draftS) { morningError = "先写一句很短的意向，或直接点完成也可以。"; render(); return; }
          morningError = "";
          state.morningIntentions[todayStr] = draftS;
          morningIntentionDraft = draftS;
          saveState(); render();
        } else if (action === "morning-log") {
          if (state.morningLoggedDates.indexOf(todayStr) === -1) {
            var intentionForLog = (state.morningIntentions && state.morningIntentions[todayStr]) || (morningIntentionDraft || "").trim();
            state.logs.unshift({ id: uid(), date: todayStr, kinds: ["正念"], minutes: 3, note: intentionForLog ? "晨修三分钟 · 今日意向：" + intentionForLog : "晨修三分钟" });
            state.logs.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
            state.morningLoggedDates.push(todayStr);
            morningLogged = true;
            saveState();
          } else { morningLogged = true; }
          render();
        } else if (action === "install-entry") {
          promptInstall();
        } else if (action === "goto") {
          if (breathRunning) { breathRunning = false; breathStop(); }
          if (morningActive) { morningCaptureIntention(); morningPaused = true; morningStopTimer(); }
          tab = el.getAttribute("data-tab");
          editingLogId = null; editingQuoteId = null;
          render();
          window.scrollTo(0, 0);
          var t = TABS.filter(function (x) { return x.id === tab; })[0];
          if (t) countView(t.path);
        } else if (action === "topic") {
          lectureTopic = el.getAttribute("data-topic");
          render();
        } else if (action === "toggle-done") {
          var lid = el.getAttribute("data-id");
          var idx = state.doneLectureIds.indexOf(lid);
          if (idx === -1) state.doneLectureIds.push(lid); else state.doneLectureIds.splice(idx, 1);
          saveState(); render();
        } else if (action === "save-fayu") {
          saveFayuById(el.getAttribute("data-id"));
          render();
        } else if (action === "kind") {
          var mel = document.getElementById("minutes");
          var nel = document.getElementById("new-note");
          if (mel) formMinutes = mel.value;
          if (nel) formNote = nel.value;
          var k = el.getAttribute("data-kind");
          var ki = formKinds.indexOf(k);
          if (ki === -1) formKinds.push(k); else formKinds.splice(ki, 1);
          render();
        } else if (action === "add-log") {
          var minutesEl = document.getElementById("minutes");
          var noteEl = document.getElementById("new-note");
          var minutesRaw = minutesEl ? minutesEl.value.trim() : "";
          var noteVal = noteEl ? noteEl.value.trim() : "";
          formMinutes = minutesRaw; formNote = noteVal;
          if (formKinds.length === 0) { formError = "先选一种修行方式。"; render(); return; }
          var minutes = null;
          if (minutesRaw !== "") {
            var n = Number(minutesRaw);
            if (!isFinite(n) || n < 1 || n > 1440) { formError = "时长填 1–1440 之间的分钟数，或者留空。"; render(); return; }
            minutes = n;
          }
          formError = "";
          formMinutes = ""; formNote = "";
          state.logs.unshift({ id: uid(), date: todayStr, kinds: formKinds.slice(), minutes: minutes, note: noteVal });
          state.logs.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
          saveState(); render();
          window.scrollTo(0, 0);
        } else if (action === "edit-log") {
          var eid = el.getAttribute("data-id");
          editingLogId = editingLogId === eid ? null : eid;
          render();
        } else if (action === "cancel-edit-log") {
          editingLogId = null; render();
        } else if (action === "save-log-note") {
          var sid = el.getAttribute("data-id");
          var ta = document.getElementById("log-note-" + sid);
          var val = ta ? ta.value.trim() : "";
          state.logs.forEach(function (l) { if (l.id === sid) l.note = val; });
          editingLogId = null; saveState(); render();
        } else if (action === "delete-log") {
          var did = el.getAttribute("data-id");
          state.logs = state.logs.filter(function (l) { return l.id !== did; });
          if (editingLogId === did) editingLogId = null;
          saveState(); render();
        } else if (action === "month") {
          var dir = Number(el.getAttribute("data-dir"));
          if (dir === 0) monthOffset = 0; else monthOffset += dir;
          if (monthOffset > 0) monthOffset = 0;
          render();
        } else if (action === "edit-quote") {
          editingQuoteId = el.getAttribute("data-id"); render();
        } else if (action === "cancel-edit-quote") {
          editingQuoteId = null; render();
        } else if (action === "save-reflection") {
          var qid = el.getAttribute("data-id");
          var rta = document.getElementById("refl-" + qid);
          var rval = rta ? rta.value.trim() : "";
          state.quotes.forEach(function (q) { if (q.id === qid) q.reflection = rval; });
          editingQuoteId = null; saveState(); render();
        } else if (action === "delete-quote") {
          var qdid = el.getAttribute("data-id");
          state.quotes = state.quotes.filter(function (q) { return q.id !== qdid; });
          if (editingQuoteId === qdid) editingQuoteId = null;
          saveState(); render();
        } else if (action === "add-manual") {
          var mt = document.getElementById("manual-fayu");
          var ms = document.getElementById("manual-source");
          var text = mt ? mt.value.trim() : "";
          var source = ms ? ms.value.trim() : "";
          if (!text) { fayuError = "先写下那句话。"; render(); return; }
          fayuError = "";
          state.quotes.unshift({ id: uid(), text: text, source: source, reflection: "" });
          saveState(); render();
          window.scrollTo(0, 0);
        } else if (action === "fav-talk") {
          var tid = el.getAttribute("data-id");
          var ti = state.talkFavIds.indexOf(tid);
          if (ti === -1) state.talkFavIds.push(tid); else state.talkFavIds.splice(ti, 1);
          saveState(); render();
        } else if (action === "breath-rhythm") {
          breathReset(); breathRhythm = el.getAttribute("data-id"); render();
        } else if (action === "breath-minutes") {
          breathReset(); breathMinutes = Number(el.getAttribute("data-min")); render();
        } else if (action === "breath-start") {
          breathRunning = true; breathFinished = false; render();
        } else if (action === "breath-pause") {
          breathRunning = false; breathStop(); render();
        } else if (action === "breath-reset") {
          breathReset(); render();
        } else if (action === "breath-log") {
          state.logs.unshift({ id: uid(), date: todayStr, kinds: ["正念"], minutes: breathMinutes, note: "正念呼吸 · " + BREATH_RHYTHMS[breathRhythm].label + " 节奏" });
          state.logs.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
          breathLogged = true;
          saveState(); render();
        } else if (action === "guide-toggle") {
          var gid = el.getAttribute("data-id");
          if (openGuideId === gid) { openGuideId = null; } else { openGuideId = gid; guideStep = 0; }
          render();
        } else if (action === "guide-next") {
          guideStep += 1; render();
        } else if (action === "guide-prev") {
          if (guideStep > 0) guideStep -= 1; render();
        } else if (action === "add-my-talk") {
          var mta = document.getElementById("my-talk");
          var mtext = mta ? mta.value.trim() : "";
          if (!mtext) { talkError = "先写一句话给自己。"; render(); return; }
          talkError = "";
          state.myTalks.unshift({ id: uid(), text: mtext });
          saveState(); render();
        } else if (action === "delete-my-talk") {
          var mdid = el.getAttribute("data-id");
          state.myTalks = state.myTalks.filter(function (t) { return t.id !== mdid; });
          saveState(); render();
        } else if (action === "add-reframe") {
          var rh = document.getElementById("reframe-harsh");
          var rk = document.getElementById("reframe-kind");
          var harsh = rh ? rh.value.trim() : "";
          var kind = rk ? rk.value.trim() : "";
          if (!harsh || !kind) { reframeError = "两栏都写上：原来的话，和换一种说法。"; render(); return; }
          reframeError = "";
          state.reframes.unshift({ id: uid(), harsh: harsh, kind: kind });
          saveState(); render();
        } else if (action === "delete-reframe") {
          var rdid = el.getAttribute("data-id");
          state.reframes = state.reframes.filter(function (r) { return r.id !== rdid; });
          saveState(); render();
        }
      });

      document.addEventListener("input", function (ev) {
        if (ev.target && ev.target.id === "minutes") {
          ev.target.value = ev.target.value.replace(/[^0-9]/g, "");
        }
      });

      /* ============ PWA：安装提示与离线缓存 ============ */

      var installBar = document.getElementById("install-bar");
      var installBarText = document.getElementById("install-bar-text");
      var installGoBtn = document.getElementById("install-go");
      var installCloseBtn = document.getElementById("install-close");

      function showInstallBar(mode) {
        if (isStandaloneMode() || installBarDismissed || !installBar) return;
        if (mode === "ios") {
          installBarText.innerHTML = '在 Safari 里点底部的<span class="share-glyph">「分享」</span>按钮，选「添加到主屏幕」，就能像 App 一样打开。';
          installGoBtn.hidden = true;
        } else if (mode === "prompt") {
          installBarText.textContent = "像 App 一样打开：全屏、无地址栏，离线也能看每日开示与你的修行记录。";
          installGoBtn.hidden = false;
        } else {
          installBarText.textContent = "点浏览器菜单（⋮ 或分享按钮），选「安装应用 / 添加到主屏幕」，就能像 App 一样打开。";
          installGoBtn.hidden = true;
        }
        installBar.hidden = false;
        document.body.classList.add("has-install-bar");
      }
      function hideInstallBar() {
        if (installBar) installBar.hidden = true;
        document.body.classList.remove("has-install-bar");
      }
      function promptInstall() {
        if (deferredInstallPrompt) {
          /* 调用系统安装对话框（PWA beforeinstallprompt 事件的方法，非 window 对话框） */
          var showSystemInstall = deferredInstallPrompt["prompt"];
          showSystemInstall.call(deferredInstallPrompt);
          deferredInstallPrompt.userChoice.then(function (choice) {
            if (choice && choice.outcome === "accepted") {
              deferredInstallPrompt = null;
              hideInstallBar();
            }
          }).catch(function () { /* 用户关闭系统弹窗时静默 */ });
          return;
        }
        installBarDismissed = false;
        showInstallBar(isIOSDevice() ? "ios" : "menu");
        if (installBar) installBar.scrollIntoView({ block: "nearest" });
      }

      if (installCloseBtn) {
        installCloseBtn.addEventListener("click", function () {
          installBarDismissed = true;
          hideInstallBar();
        });
      }
      if (installGoBtn) {
        installGoBtn.addEventListener("click", function () { promptInstall(); });
      }

      window.addEventListener("beforeinstallprompt", function (ev) {
        ev.preventDefault();
        deferredInstallPrompt = ev;
        showInstallBar("prompt");
      });
      window.addEventListener("appinstalled", function () {
        deferredInstallPrompt = null;
        hideInstallBar();
        render();
      });
      /* iOS 没有 beforeinstallprompt：首次打开时给出手动添加指引 */
      if (isIOSDevice() && !isStandaloneMode()) {
        setTimeout(function () { showInstallBar("ios"); }, 1200);
      }

      /* 注册 Service Worker（根目录 sw.js，作用域覆盖整个应用；离线缓存外壳与图片） */
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").then(function (reg) {
            if (reg && reg.update) reg.update();
          }).catch(function () {
            /* 个别托管环境不提供根目录文件时静默降级：清单与图标仍可用于添加到主屏幕 */
          });
        });
      }

      loadState();
      render();
    </script>
  </body>
</html>
